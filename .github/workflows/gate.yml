name: gate

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - name: self tests
        run: python tests/test_gate.py
